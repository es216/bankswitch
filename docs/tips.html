<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>hopper - top tips</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }
    body, html { height: 100%; overflow-x: hidden; }

    body {
        background: linear-gradient(to bottom, #CBF3D2, #008DD5);
        color: #1c1c1c;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    /* ---------- NAVBAR (matches index.html) ---------- */

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 10px 40px;
    }

    .hopper_logo {
      font-size: 3rem;
      font-weight: bold;
      color: #ff5d07;
      cursor: pointer;
      text-decoration: none;
    }

    .hopper_logo .o {
      position: relative;
      display: inline-block;
      top: -5px;
      padding: 0 6px;
      margin: 0 -6px;
      line-height: 1;
    }

    .nav_links {
      display: flex;
      gap: 20px;
    }

    .nav_button {
      color: black;
      font-size: 1rem;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
      transition: color .3s ease;
    }

    .nav_button:hover {
      color: rgb(87, 87, 87);
    }

    /* Burger menu button (mobile only) */
    .burger {
      display: none;
      font-size: 2rem;
      cursor: pointer;
    }

    /* Fullscreen mobile menu */
    .mobile_menu {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 100%;
      background: #fff;
      display: none;
      flex-direction: column;
      padding: 80px 30px 20px;
      z-index: 9999;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 2.2rem;
      cursor: pointer;
      color: rgb(87, 87, 87);
    }

    .mobile_menu a {
      padding: 12px 0;
      text-decoration: none;
      color: black;
      font-weight: 600;
      border-bottom: 1px solid #eee;
    }

    .mobile_menu a:last-child {
      border-bottom: none;
    }

    /* Mobile navbar adjustments */
    @media (max-width: 900px) {
      .nav_links { display: none; }
      .burger { display: block; }
      .navbar { padding: 10px 20px; }
    }

    /* ---------- MAINTENANCE MESSAGE ---------- */

    .main {
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      width: 100%;
      height: 70vh;
      padding: 20px;
    }

    .maintenance {
      font-size: 2.5rem;
      font-weight: 700;
      color: #ff5d07;
      line-height: 1.2;
    }

    @media (max-width: 700px) {
      .maintenance {
        font-size: 2rem;
      }
    }

  </style>
</head>

<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <a href="index.html" class="hopper_logo">h<span class="o">o</span>pper</a>

    <div class="nav_links">
      <a href="index.html" class="nav_button">home</a>
      <a href="offers.html" class="nav_button">current switch offers</a>
      <a href="how.html" class="nav_button">how does it work?</a>
      <a href="tips.html" class="nav_button">top tips</a>
      <a href="contact.html" class="nav_button">contact</a>
    </div>

    <div class="burger" id="burger">&#9776;</div>
  </div>

  <!-- MOBILE MENU -->
  <div class="mobile_menu" id="mobile_menu">
    <span class="close-btn" id="close_menu">&times;</span>

    <a href="index.html">home</a>
    <a href="offers.html">current switch offers</a>
    <a href="how.html">how does it work?</a>
    <a href="tips.html">top tips</a>
    <a href="contact.html">contact</a>
  </div>

  <!-- PAGE CONTENT -->
  <div class="main">
      <div class="maintenance">Under maintenance…<br>check back soon</div>
  </div>

<script>
  // Mobile menu logic
  const menu = document.getElementById("mobile_menu");
  const burger = document.getElementById("burger");
  const closeBtn = document.getElementById("close_menu");

  burger.addEventListener("click", () => {
    menu.style.display = "flex";
    burger.style.display = "none";
    document.body.style.overflow = "hidden";
  });

  closeBtn.addEventListener("click", () => {
    menu.style.display = "none";
    burger.style.display = "block";
    document.body.style.overflow = "auto";
  });
</script>

</body>
</html>
