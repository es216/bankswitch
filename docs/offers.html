<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hopper - Current Switch Offers</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }
    body, html { height: auto; min-height: 100vh; background: linear-gradient(to bottom, #CBF3D2 0%, #008DD5 100%); overflow-x: hidden; }

    body {
      
      color: #1c1c1c;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      justify-content: flex-start;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 10px 40px;
    }

    .hopper_logo {
      font-size: 3rem;
      font-weight: bold;
      color: #ff5d07;
      cursor: pointer;
      text-decoration: none;
    }

    .hopper_logo .o {
      position: relative;
      top: -5px;
      display: inline-block;
      padding: 0 6px;
      margin: 0 -6px;
      line-height: 1;
    }

    .nav_links {
      display: flex;
      gap: 20px;
    }

    .nav_button {
      color: black;
      font-size: 1rem;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
      transition: color .3s ease;
    }

    .nav_button:hover {
      color: rgb(87, 87, 87);
    }

    /* Burger icon (hidden on desktop) */
    .burger {
      display: none;
      font-size: 2rem;
      cursor: pointer;
    }

    /* Full-screen mobile menu */
    .mobile_menu {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 100%;
      background: #fff;
      display: none;
      flex-direction: column;
      padding: 80px 30px 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      z-index: 9999;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 2.2rem;
      cursor: pointer;
      color: rgb(87, 87, 87);
    }

    .mobile_menu a {
      padding: 12px 0;
      text-decoration: none;
      color: black;
      font-weight: 600;
      border-bottom: 1px solid #eee;
    }

    .mobile_menu a:last-child {
      border-bottom: none;
    }


    @media (max-width: 900px) {
      .nav_links { display: none; }
      .burger { display: block; }

      .navbar {
        padding: 10px 20px;
      }
    }



    .hero {
      font-size: 2rem;
      padding-top: 2rem;
      padding-bottom: 1rem;
      text-align: center;
    }

    .call_to_action {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .spinner {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #ff5d07;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-top: 30px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #results-container {
      margin-top: 1rem;
      margin-bottom: 2rem;
      width: 90%;
      max-width: 900px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      padding: 30px;
      text-align: center;
      display: none;
    }

    #results {
      display: flex;
      flex-direction: column;
      align-items: center;   /* horizontally centres cards */
      width: 100%;
    }

    .total-bonus {
      font-size: 1.3rem;
      font-weight: 700;
      color: #ff5d07;
      margin-bottom: 15px;
    }

    .table-wrapper {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 1s ease-out, opacity 0.8s ease-out;
    }

    .table-wrapper.show {
      max-height: 800px;
      opacity: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      text-align: left;
      padding: 10px 12px;
    }

    th {
      background-color: #ff5d07;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #9bc1bc;
    }

    tr:hover {
      background-color: #ffe3d0;
      transition: background 0.3s;
    }

    .bank-logo {
      height: 70px;
      width: auto;
      margin-right: 8px;
      border-radius: 4px;
      vertical-align: middle;
    }

    /* ------------------------------------------
   CARD STYLING (same base as index.html)
------------------------------------------- */
.offer-card {
  background: white;
  border-radius: 16px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  padding: 20px;
  margin-bottom: 20px;
  width: 90%;
  max-width: 700px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.offer-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 30px rgba(0,0,0,0.15);
}

.offer-logo {
  width: 80px;
  height: auto;
  border-radius: 6px;
  margin-right: 15px;
}

/* Card content */
.offer-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.offer-bank-name {
  font-size: 1.25rem;
  font-weight: 700;
}

.offer-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.95rem;
}

/* BONUS highlight */
.offer-bonus {
  font-size: 1.3rem;
  font-weight: 800;
  color: #ff5d07;
  margin-top: 6px;
}

/* ------------------------
   DESKTOP IMPROVEMENTS
------------------------ */
@media (min-width: 900px) {
  .offer-card {
    max-width: 1000px;
    padding: 28px;
  }

  .offer-info {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }

  .offer-bank-name {
    width: 25%;
  }

  .offer-row {
    width: 25%;
    text-align: center;
    display: block;
  }

  .offer-bonus {
    width: 20%;
    text-align: right;
  }
}

  </style>
</head>
<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <a href="index.html" class="hopper_logo">h<span class="o">o</span>pper</a>

    <div class="nav_links">
      <a href="index.html" class="nav_button">home</a>
      <a href="offers.html" class="nav_button">current switch offers</a>
      <a href="how.html" class="nav_button">how does it work?</a>
      <a href="tips.html" class="nav_button">top tips</a>
      <a href="contact.html" class="nav_button">contact</a>
    </div>

    <div class="burger" id="burger">&#9776;</div>
  </div>

  <!-- MOBILE MENU -->
  <div class="mobile_menu" id="mobile_menu">
    <span class="close-btn" id="close_menu">&times;</span>

    <a href="index.html">home</a>
    <a href="offers.html">current switch offers</a>
    <a href="how.html">how does it work?</a>
    <a href="tips.html">top tips</a>
    <a href="contact.html">contact</a>
  </div>

  <!-- PAGE CONTENT -->
  <div class="hero">current bank switch offers</div>
  <div class="call_to_action">find the latest switch deals available right now</div>

  <div id="loading-spinner" class="spinner" style="display:none;"></div>

  <div id="results-container">
    <p class="total-bonus" id="total-bonus"></p>
    <p id="results-text"></p>
    <div id="results"></div>
  </div>

<script>
  // Detect backend
  const hostname = window.location.hostname;
  const isLocal = !hostname || hostname === "localhost" || hostname === "127.0.0.1";
  const API_BASE_URL = isLocal ? "http://127.0.0.1:5000" : "https://bankswitch-backend.onrender.com";

  // Burger menu logic
  const menu = document.getElementById("mobile_menu");
  const burger = document.getElementById("burger");
  const closeBtn = document.getElementById("close_menu");

  burger.addEventListener("click", () => {
    menu.style.display = "flex";
    burger.style.display = "none";
    document.body.style.overflow = "hidden";
  });

  closeBtn.addEventListener("click", () => {
    menu.style.display = "none";
    burger.style.display = "block";
    document.body.style.overflow = "auto";
  });

  // Fetch and display live offers
  async function loadLiveOffers() {
    const spinner = document.getElementById("loading-spinner");
    const resultsContainer = document.getElementById("results-container");
    const results = document.getElementById("results");
    const totalBonus = document.getElementById("total-bonus");

    spinner.style.display = "block";

    const startTime = Date.now();

    try {
      const response = await fetch(`${API_BASE_URL}/live_offers`);
      const data = await response.json();

      const elapsed = Date.now() - startTime;
      const minDuration = 1000;
      if (elapsed < minDuration) {
        await new Promise(resolve => setTimeout(resolve, minDuration - elapsed));
      }

      spinner.style.display = "none";
      resultsContainer.style.display = "block";

      totalBonus.textContent = `There is currently £${data.sum_bonus.toLocaleString()} available in bank switch bonuses.`;

      results.innerHTML = ""; // clear

      data.live_offers.forEach(bank => {
        const card = document.createElement("div");
        card.classList.add("offer-card");

        card.innerHTML = `
          <img src="${bank.logo}" class="offer-logo" alt="${bank.bank_name} logo">

          <div class="offer-info">
            <div class="offer-bank-name">${bank.bank_name}</div>

            <div class="offer-row"><strong>Deposit:</strong> £${bank.min_deposit.toLocaleString()}</div>
            <div class="offer-row"><strong>Direct Debits:</strong> ${bank.min_direct_debits}</div>

            <div class="offer-bonus">£${bank.switch_bonus.toLocaleString()}</div>
          </div>
        `;

        results.appendChild(card);
      });


    } catch (error) {
      console.error("Failed to load live offers:", error);
      spinner.style.display = "none";
      resultsContainer.style.display = "block";
      results.textContent = "Sorry, we couldn’t load the offers at this time.";
    }
  }

  loadLiveOffers();
</script>

</body>
</html>
